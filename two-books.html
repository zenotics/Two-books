<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Two Books</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap');

  :root {
    --ink: #000000;
    --ink-soft: rgba(255,255,255,0.05);
    --paper: #ffffff;
    --paper-dim: #8a8a8a;
    --line: #2c2c2c;
    --green: #ffffff;
    --green-dim: #333333;
    --red: #ffffff;
    --red-dim: #333333;
    --gold: #ffffff;
    --gold-dim: #444444;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-mono);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #000000;
  }

  .dragon-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .dragon {
    position: absolute;
    opacity: 0.35;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.15));
    will-change: transform;
  }
  .dragon svg { width: 100%; height: 100%; display: block; }
  .dragon.d1 { top: 10%; left: -40%; width: 320px; animation: flyRight1 36s linear infinite; }
  .dragon.d2 { top: 58%; left: -50%; width: 240px; animation: flyRight2 48s linear infinite; animation-delay: -14s; opacity: 0.22; }
  .dragon.d3 { top: 32%; left: -35%; width: 190px; animation: flyRight3 30s linear infinite; animation-delay: -7s; opacity: 0.18; }

  @keyframes flyRight1 {
    0%   { transform: translate(0, 0) rotate(-2deg); }
    50%  { transform: translate(70vw, -6vh) rotate(2deg); }
    100% { transform: translate(150vw, 4vh) rotate(-2deg); }
  }
  @keyframes flyRight2 {
    0%   { transform: translate(0, 0) rotate(3deg); }
    50%  { transform: translate(80vw, 8vh) rotate(-3deg); }
    100% { transform: translate(160vw, -5vh) rotate(3deg); }
  }
  @keyframes flyRight3 {
    0%   { transform: translate(0, 0) rotate(-4deg); }
    50%  { transform: translate(65vw, 5vh) rotate(4deg); }
    100% { transform: translate(140vw, -8vh) rotate(-4deg); }
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: transparent;
    position: relative;
    z-index: 1;
  }

  header.masthead {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  header.masthead .title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--paper);
  }

  header.masthead .title span {
    color: var(--gold);
  }

  header.masthead .date {
    font-size: 11px;
    color: var(--paper-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 90px;
  }

  .panel {
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--paper-dim);
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .section-label:first-child { margin-top: 0; }

  /* Stat grid */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-card {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 12px;
  }
  .stat-card .label {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--paper-dim);
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 20px;
    font-weight: 700;
  }
  .stat-card .value.pos { color: var(--green); }
  .stat-card .value.neg { color: var(--red); }

  /* Position / trade rows */
  .row-card {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .row-card.win { border-left-style: solid; }
  .row-card.loss { border-left-style: dashed; }
  .row-card .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .row-card .name {
    font-size: 13px;
    line-height: 1.3;
  }
  .row-card .meta {
    font-size: 11px;
    color: var(--paper-dim);
    margin-top: 4px;
  }
  .row-card .num {
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }
  .row-card .num.pos { color: var(--green); }
  .row-card .num.neg { color: var(--red); }
  .row-card .del {
    position: absolute;
    top: 6px;
    right: 8px;
    color: var(--paper-dim);
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .gap-card {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .gap-card .name { font-size: 13px; margin-bottom: 6px; }
  .gap-row { display: flex; justify-content: space-between; font-size: 12px; }
  .gap-row .book { color: var(--paper-dim); }
  .gap-row .price { font-weight: 700; }
  .gap-diff { margin-top: 6px; font-size: 12px; color: var(--gold); font-weight: 700; }

  .empty {
    color: var(--paper-dim);
    font-size: 13px;
    font-family: var(--font-display);
    font-size: 15px;
    padding: 18px 4px;
    border: 1px dashed var(--line);
    text-align: center;
  }

  /* Forms */
  .add-form {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 12px;
    margin-bottom: 14px;
  }
  .add-form input, .add-form textarea, .add-form select {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px;
    margin-bottom: 8px;
    color-scheme: dark;
  }
  .add-form input[type="date"],
  .add-form input[type="time"] {
    appearance: none;
    -webkit-appearance: none;
  }
  .add-form textarea { resize: vertical; min-height: 50px; }
  .add-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 9px 14px;
    cursor: pointer;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn { transition: transform 0.08s ease, background 0.08s ease; }
  .btn.ghost {
    background: transparent;
    color: var(--paper-dim);
    border: 1px solid var(--line);
  }
  .btn.ghost:active { background: rgba(255,255,255,0.08); }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .filter-chip {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--paper-dim);
    cursor: pointer;
  }
  .filter-chip.active {
    background: #ffffff;
    color: #000000;
  }

  .sparkline-wrap {
    margin-top: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 10px 12px;
  }
  .sparkline-wrap .label {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--paper-dim);
    margin-bottom: 6px;
  }
  #roi-sparkline { width: 100%; height: 50px; display: block; }

  .backup-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .backup-row .btn { font-size: 12px; padding: 8px 10px; }

  /* Game detail modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 10;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-sheet {
    background: #000000;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0));
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-header .name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
  }
  .modal-close {
    font-size: 20px;
    color: var(--paper-dim);
    cursor: pointer;
    padding: 4px 8px;
  }
  .game-card { cursor: pointer; }

  /* Watchlist */
  .game-card {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .game-card .name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .game-card .sub { font-size: 11px; color: var(--paper-dim); }
  .game-card .time-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    background: rgba(212,175,55,0.1);
    border: 1px solid var(--gold-dim);
    padding: 2px 8px;
  }
  .date-header {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin: 16px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .date-header:first-child { margin-top: 0; }

  /* Events */
  .event-card {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .event-card .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; padding-right: 20px; }
  .event-card .range { font-size: 12px; color: var(--paper-dim); }
  .event-card .status {
    display: inline-block;
    margin-top: 6px;
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 2px 8px;
    border: 1px solid var(--line);
  }
  .event-card .status.live { color: #000; background: #ffffff; }
  .event-card .status.upcoming { color: var(--paper-dim); }
  .event-card .status.ended { color: var(--paper-dim); border-style: dashed; }
  .event-card .del {
    position: absolute; top: 6px; right: 8px;
    color: var(--paper-dim); cursor: pointer; padding: 4px;
  }
  .game-card .del {
    position: absolute; top: 6px; right: 8px;
    color: var(--paper-dim); cursor: pointer; padding: 4px;
  }

  /* Notes */
  .note-card {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .note-card .game { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .note-card .text { font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
  .note-card .del {
    position: absolute; top: 6px; right: 8px;
    color: var(--paper-dim); cursor: pointer; padding: 4px;
  }

  /* Checklist */
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .check-item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: var(--gold);
    margin-top: 1px;
    flex-shrink: 0;
  }
  .check-item .qtext { flex: 1; font-size: 13px; line-height: 1.4; }
  .check-item.checked .qtext { color: var(--paper-dim); text-decoration: line-through; }
  .check-item .del { color: var(--paper-dim); cursor: pointer; flex-shrink: 0; padding: 2px; }

  /* Bottom nav */
  nav.tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 2;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 10.5px;
    padding: 9px 2px 7px;
    cursor: pointer;
    border-top: 2px solid transparent;
    margin-top: -2px;
  }
  nav.tabbar button.active {
    color: var(--gold);
    border-top-color: var(--gold);
  }
  nav.tabbar button .icon {
    display: block;
    font-size: 17px;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="dragon-layer">
  <div class="dragon d1">
    <svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
      <!-- serpentine body, tapering toward tail -->
      <path d="M40,175 C90,115 135,195 185,140 C235,80 280,180 330,120 C380,60 425,155 470,105 C505,68 545,80 575,58 C598,42 618,44 636,40"
            stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="M40,175 C90,115 135,195 185,140 C235,80 280,180 330,120 C380,60 425,155 470,105 C505,68 545,80 575,58 C598,42 618,44 636,40"
            stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"
            transform="translate(0,6)"/>
      <!-- tail taper -->
      <path d="M40,175 C22,182 8,178 4,192" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- swept mane/dorsal spikes -->
      <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M170,142 C158,128 150,118 154,102"/>
        <path d="M258,155 C246,142 240,130 246,114"/>
        <path d="M328,122 C316,108 310,96 317,80"/>
        <path d="M410,132 C398,118 393,106 401,90"/>
        <path d="M470,107 C459,93 455,82 463,68"/>
        <path d="M540,80 C530,67 527,58 536,46"/>
        <path d="M590,58 C582,47 580,40 589,30"/>
      </g>

      <!-- legs with claws -->
      <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M300,145 C295,165 300,178 292,192"/>
        <path d="M285,190 L273,198 M291,193 L288,203 M297,190 L302,200"/>
        <path d="M450,115 C446,134 452,146 444,160"/>
        <path d="M438,158 L426,166 M444,161 L441,171 M450,158 L455,168"/>
      </g>

      <!-- head: elongated snout, not a round blob -->
      <path d="M632,42 C644,22 662,10 684,15 C698,19 706,28 704,38
               C702,48 692,54 682,50 C688,58 684,68 674,66
               C666,64 660,60 651,60 C640,60 630,52 632,42 Z"
            fill="rgba(255,255,255,0.14)" stroke="#ffffff" stroke-width="2.2"/>
      <!-- lower jaw line -->
      <path d="M650,58 C660,66 674,68 686,60" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.8"/>
      <!-- nostril -->
      <circle cx="692" cy="32" r="1.6" fill="#ffffff"/>
      <!-- eye -->
      <circle cx="662" cy="34" r="2.6" fill="#ffffff"/>
      <!-- horn -->
      <path d="M666,16 C670,4 680,-2 690,-8" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M672,20 C678,12 686,8 694,4" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- whiskers -->
      <path d="M700,40 C712,44 720,54 716,66" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M694,52 C702,60 704,72 696,80" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    </svg>
  </div>
  <div class="dragon d2">
    <svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M40,175 C90,115 135,195 185,140 C235,80 280,180 330,120 C380,60 425,155 470,105 C505,68 545,80 575,58 C598,42 618,44 636,40"
            stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M40,175 C22,182 8,178 4,192" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <g stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M258,155 C246,142 240,130 246,114"/>
        <path d="M410,132 C398,118 393,106 401,90"/>
        <path d="M540,80 C530,67 527,58 536,46"/>
      </g>
      <path d="M632,42 C644,22 662,10 684,15 C698,19 706,28 704,38
               C702,48 692,54 682,50 C688,58 684,68 674,66
               C666,64 660,60 651,60 C640,60 630,52 632,42 Z"
            fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="662" cy="34" r="2.2" fill="#ffffff"/>
      <path d="M666,16 C670,4 680,-2 690,-8" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M700,40 C712,44 720,54 716,66" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    </svg>
  </div>
  <div class="dragon d3">
    <svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M40,175 C90,115 135,195 185,140 C235,80 280,180 330,120 C380,60 425,155 470,105 C505,68 545,80 575,58 C598,42 618,44 636,40"
            stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M632,42 C644,22 662,10 684,15 C698,19 706,28 704,38
               C702,48 692,54 682,50 C688,58 684,68 674,66
               C666,64 660,60 651,60 C640,60 630,52 632,42 Z"
            fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="1.4"/>
      <circle cx="662" cy="34" r="1.8" fill="#ffffff"/>
      <path d="M666,16 C670,4 680,-2 690,-8" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</div>
<div id="app">
  <header class="masthead">
    <div class="title">Two <span>Books</span></div>
    <div class="date" id="today"></div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section class="panel active" id="panel-dashboard">
      <div class="section-label">Performance</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Win rate</div><div class="value" id="stat-winrate">—</div></div>
        <div class="stat-card"><div class="label">ROI</div><div class="value" id="stat-roi">—</div></div>
        <div class="stat-card"><div class="label">Record</div><div class="value" id="stat-record">—</div></div>
        <div class="stat-card"><div class="label">Net P/L</div><div class="value" id="stat-pnl">—</div></div>
      </div>
      <div class="sparkline-wrap">
        <div class="label">Cumulative P/L over time</div>
        <canvas id="roi-sparkline"></canvas>
      </div>

      <div class="section-label">Open positions</div>
      <div class="add-form">
        <input type="text" id="pos-name" placeholder="Market / game name">
        <div class="row2">
          <select id="pos-book">
            <option>Kalshi</option>
            <option>Polymarket</option>
          </select>
          <input type="number" step="0.01" id="pos-stake" placeholder="Stake ($)">
        </div>
        <div class="row2">
          <input type="number" step="0.01" id="pos-entry" placeholder="Entry price">
          <input type="number" step="0.01" id="pos-value" placeholder="Current value">
        </div>
        <button class="btn" onclick="addPosition()">Add position</button>
      </div>
      <div id="positions-list"></div>

      <div class="section-label">Trade history</div>
      <div class="add-form">
        <input type="text" id="trade-name" placeholder="Market / game name">
        <div class="row2">
          <select id="trade-book">
            <option>Kalshi</option>

<script>
/* ---------- Floating dots background ---------- */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, dots;
  const pointer = { x: -9999, y: -9999, active: false };

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.max(40, Math.floor((w * h) / 14000));
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.4 + 0.6
    }));
  }

  function step() {
    ctx.clearRect(0, 0, w, h);

    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;

      if (pointer.active) {
        const dx = d.x - pointer.x, dy = d.y - pointer.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 90 && dist > 0.01) {
          const force = (90 - dist) / 90 * 0.6;
          d.x += (dx / dist) * force;
          d.y += (dy / dist) * force;
        }
      }

      if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
      if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 110) {
          ctx.globalAlpha = 1 - dist / 110;
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const d of dots) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(step);
  }

  function setPointer(x, y) {
    pointer.x = x; pointer.y = y; pointer.active = true;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('mouseleave', () => pointer.active = false);
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchend', () => pointer.active = false);

  resize();
  step();
})();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

let state = {
  positions: [],
  trades: [],
  gaps: [],
  games: [],
  notes: [],
  checklist: [],
  events: []
};

let tradeFilter = 'all';
let currentDetailGame = null;

async function loadState() {
  try {
    const saved = localStorage.getItem('two-books-state');
    if (saved) state = JSON.parse(saved);
  } catch (e) {
    console.log('No existing state, starting fresh');
  }
  renderAll();
}

async function saveState() {
  try {
    localStorage.setItem('two-books-state', JSON.stringify(state));
  } catch (e) {
    console.error('Save failed', e);
  }
}

function switchPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.panel === name));
}

function fmt(n) {
  const v = Number(n) || 0;
  return (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2);
}

/* ---------- Dashboard: stats ---------- */
function renderStats() {
  const trades = state.trades;
  const wins = trades.filter(t => t.result === 'win').length;
  const total = trades.length;
  const winRate = total ? ((wins / total) * 100).toFixed(1) + '%' : '—';
  const totalStaked = trades.reduce((s, t) => s + Math.abs(Number(t.pnl) || 0), 0);
  const netPnl = trades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
  const roi = totalStaked ? ((netPnl / totalStaked) * 100).toFixed(1) + '%' : '—';

  document.getElementById('stat-winrate').textContent = winRate;
  document.getElementById('stat-roi').textContent = roi;
  const roiEl = document.getElementById('stat-roi');
  roiEl.className = 'value ' + (netPnl > 0 ? 'pos' : netPnl < 0 ? 'neg' : '');
  document.getElementById('stat-record').textContent = total ? `${wins}-${total - wins}` : '—';
  const pnlEl = document.getElementById('stat-pnl');
  pnlEl.textContent = total ? fmt(netPnl) : '—';
  pnlEl.className = 'value ' + (netPnl > 0 ? 'pos' : netPnl < 0 ? 'neg' : '');
}

/* ---------- Positions ---------- */
function addPosition() {
  const name = document.getElementById('pos-name').value.trim();
  if (!name) return;
  state.positions.push({
    id: uid(),
    name,
    book: document.getElementById('pos-book').value,
    stake: document.getElementById('pos-stake').value,
    entry: document.getElementById('pos-entry').value,
    value: document.getElementById('pos-value').value
  });
  ['pos-name','pos-stake','pos-entry','pos-value'].forEach(id => document.getElementById(id).value = '');
  saveState(); renderPositions();
}
function removePosition(id) {
  state.positions = state.positions.filter(p => p.id !== id);
  saveState(); renderPositions();
}
function renderPositions() {
  const el = document.getElementById('positions-list');
  if (!state.positions.length) { el.innerHTML = '<div class="empty">No open positions yet</div>'; return; }
  el.innerHTML = state.positions.map(p => {
    const change = (Number(p.value) || 0) - (Number(p.entry) || 0);
    const cls = change > 0 ? 'pos' : change < 0 ? 'neg' : '';
    return `<div class="row-card">
      <span class="del" onclick="removePosition('${p.id}')">✕</span>
      <div class="top">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="num ${cls}">${p.value ? '$' + Number(p.value).toFixed(2) : '—'}</div>
      </div>
      <div class="meta">${p.book} · stake $${Number(p.stake || 0).toFixed(2)} · entry ${p.entry || '—'}</div>
    </div>`;
  }).join('');
}

/* ---------- Trades ---------- */
function addTrade() {
  const name = document.getElementById('trade-name').value.trim();
  if (!name) return;
  const book = document.getElementById('trade-book').value;
  const result = document.getElementById('trade-result').value;
  let pnl = Number(document.getElementById('trade-pnl').value) || 0;
  if (result === 'loss' && pnl > 0) pnl = -pnl;
  state.trades.unshift({ id: uid(), name, book, result, pnl, ts: Date.now() });
  document.getElementById('trade-name').value = '';
  document.getElementById('trade-pnl').value = '';
  saveState(); renderTrades(); renderStats(); renderSparkline();
}
function removeTrade(id) {
  state.trades = state.trades.filter(t => t.id !== id);
  saveState(); renderTrades(); renderStats(); renderSparkline();
}
function setTradeFilter(f) {
  tradeFilter = f;
  document.querySelectorAll('#trade-filters .filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderTrades();
}
function renderTrades() {
  const el = document.getElementById('trades-list');
  let list = state.trades;
  if (tradeFilter === 'win' || tradeFilter === 'loss') list = list.filter(t => t.result === tradeFilter);
  else if (tradeFilter === 'Kalshi' || tradeFilter === 'Polymarket') list = list.filter(t => t.book === tradeFilter);
  if (!list.length) { el.innerHTML = '<div class="empty">No trades match this filter</div>'; return; }
  el.innerHTML = list.map(t => `
    <div class="row-card ${t.result}">
      <span class="del" onclick="removeTrade('${t.id}')">✕</span>
      <div class="top">
        <div class="name">${escapeHtml(t.name)}</div>
        <div class="num ${t.pnl >= 0 ? 'pos' : 'neg'}">${fmt(t.pnl)}</div>
      </div>
      <div class="meta">${t.result.toUpperCase()} · ${t.book || '—'}</div>
    </div>
  `).join('');
}

/* ---------- ROI sparkline ---------- */
function renderSparkline() {
  const canvas = document.getElementById('roi-sparkline');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const ordered = [...state.trades].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  if (ordered.length < 2) {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();
    return;
  }

  let cum = 0;
  const points = ordered.map(t => (cum += Number(t.pnl) || 0));
  const min = Math.min(0, ...points), max = Math.max(0, ...points);
  const range = (max - min) || 1;

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = (i / (points.length - 1)) * w;
    const y = h - ((p - min) / range) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  const zeroY = h - ((0 - min) / range) * h;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  ctx.lineTo(w, zeroY);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- Gaps ---------- */
function addGap() {
  const name = document.getElementById('gap-name').value.trim();
  if (!name) return;
  state.gaps.unshift({
    id: uid(), name,
    kalshi: document.getElementById('gap-kalshi').value,
    poly: document.getElementById('gap-poly').value
  });
  document.getElementById('gap-name').value = '';
  document.getElementById('gap-kalshi').value = '';
  document.getElementById('gap-poly').value = '';
  saveState(); renderGaps();
}
function removeGap(id) {
  state.gaps = state.gaps.filter(g => g.id !== id);
  saveState(); renderGaps();
}
function renderGaps() {
  const el = document.getElementById('gaps-list');
  if (!state.gaps.length) { el.innerHTML = '<div class="empty">No price gaps tracked yet</div>'; return; }
  el.innerHTML = state.gaps.map(g => {
    const k = Number(g.kalshi) || 0, p = Number(g.poly) || 0;
    const diff = Math.abs(k - p);
    return `<div class="gap-card" style="position:relative;">
      <span class="del" style="position:absolute;top:6px;right:8px;color:var(--paper-dim);cursor:pointer;" onclick="removeGap('${g.id}')">✕</span>
      <div class="name">${escapeHtml(g.name)}</div>
      <div class="gap-row"><span class="book">Kalshi</span><span class="price">${g.kalshi || '—'}</span></div>
      <div class="gap-row"><span class="book">Polymarket</span><span class="price">${g.poly || '—'}</span></div>
      <div class="gap-diff">Gap: ${diff.toFixed(2)}</div>
    </div>`;
  }).join('');
}

/* ---------- Watchlist ---------- */
function addGame() {
  const name = document.getElementById('game-name').value.trim();
  if (!name) return;
  const date = document.getElementById('game-date').value;
  const time = document.getElementById('game-time').value;
  state.games.push({ id: uid(), name, date, time, when: '' });
  document.getElementById('game-name').value = '';
  document.getElementById('game-date').value = '';
  document.getElementById('game-time').value = '';
  saveState(); renderGames();
}
function removeGame(id) {
  state.games = state.games.filter(g => g.id !== id);
  state.notes = state.notes.filter(n => n.gameId !== id);
  state.checklist = state.checklist.filter(c => c.gameId !== id);
  saveState(); renderGames(); renderNotes(); renderChecklist();
}
function formatDateHeader(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function formatTime(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}
function renderGames() {
  const el = document.getElementById('games-list');
  if (!state.games.length) { el.innerHTML = '<div class="empty">No games on your watchlist</div>'; return; }

  const dated = state.games.filter(g => g.date).sort((a, b) => {
    const ak = a.date + 'T' + (a.time || '00:00');
    const bk = b.date + 'T' + (b.time || '00:00');
    return ak.localeCompare(bk);
  });
  const undated = state.games.filter(g => !g.date);

  function cardHtml(g) {
    const noteCount = state.notes.filter(n => n.gameId === g.id).length;
    const checkCount = state.checklist.filter(c => c.gameId === g.id).length;
    const bits = [];
    if (noteCount) bits.push(noteCount + ' note' + (noteCount > 1 ? 's' : ''));
    if (checkCount) bits.push(checkCount + ' question' + (checkCount > 1 ? 's' : ''));
    if (!g.date && g.when) bits.unshift(escapeHtml(g.when));
    return `<div class="game-card" onclick="openGameDetail('${g.id}')">
      <span class="del" onclick="event.stopPropagation(); removeGame('${g.id}')">✕</span>
      <div class="name">${escapeHtml(g.name)}</div>
      ${g.time ? `<div class="time-badge">${formatTime(g.time)}</div>` : ''}
      ${bits.length ? `<div class="sub">${bits.join(' · ')}</div>` : ''}
    </div>`;
  }

  let html = '';
  let lastDate = null;
  for (const g of dated) {
    if (g.date !== lastDate) {
      html += `<div class="date-header">${formatDateHeader(g.date)}</div>`;
      lastDate = g.date;
    }
    html += cardHtml(g);
  }
  if (undated.length) {
    html += `<div class="date-header">No date set</div>`;
    for (const g of undated) html += cardHtml(g);
  }
  el.innerHTML = html;
}

/* ---------- Game detail (linked notes + checklist) ---------- */
function openGameDetail(gameId) {
  const game = state.games.find(g => g.id === gameId);
  if (!game) return;
  currentDetailGame = game;
  document.getElementById('detail-game-name').textContent = game.name;
  renderDetailNotes();
  renderDetailChecklist();
  document.getElementById('game-detail-modal').classList.add('active');
}
function closeGameDetail() {
  document.getElementById('game-detail-modal').classList.remove('active');
  currentDetailGame = null;
  renderGames();
}
function addNoteFromDetail() {
  if (!currentDetailGame) return;
  const text = document.getElementById('detail-note-text').value.trim();
  if (!text) return;
  state.notes.unshift({ id: uid(), game: currentDetailGame.name, gameId: currentDetailGame.id, text });
  document.getElementById('detail-note-text').value = '';
  saveState(); renderDetailNotes(); renderNotes();
}
function removeNoteFromDetail(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  saveState(); renderDetailNotes(); renderNotes();
}
function renderDetailNotes() {
  const el = document.getElementById('detail-notes-list');
  const list = state.notes.filter(n => n.gameId === currentDetailGame.id);
  if (!list.length) { el.innerHTML = '<div class="empty">No notes for this game yet</div>'; return; }
  el.innerHTML = list.map(n => `
    <div class="note-card">
      <span class="del" onclick="removeNoteFromDetail('${n.id}')">✕</span>
      <div class="text">${escapeHtml(n.text)}</div>
    </div>
  `).join('');
}
function addCheckFromDetail() {
  if (!currentDetailGame) return;
  const text = document.getElementById('detail-check-text').value.trim();
  if (!text) return;
  state.checklist.push({ id: uid(), text, checked: false, gameId: currentDetailGame.id });
  document.getElementById('detail-check-text').value = '';
  saveState(); renderDetailChecklist(); renderChecklist();
}
function toggleCheckFromDetail(id) {
  const item = state.checklist.find(c => c.id === id);
  if (item) item.checked = !item.checked;
  saveState(); renderDetailChecklist();
}
function removeCheckFromDetail(id) {
  state.checklist = state.checklist.filter(c => c.id !== id);
  saveState(); renderDetailChecklist(); renderChecklist();
}
function renderDetailChecklist() {
  const el = document.getElementById('detail-checklist-list');
  const list = state.checklist.filter(c => c.gameId === currentDetailGame.id);
  if (!list.length) { el.innerHTML = '<div class="empty">No questions for this game yet</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="check-item ${c.checked ? 'checked' : ''}">
      <input type="checkbox" ${c.checked ? 'checked' : ''} onchange="toggleCheckFromDetail('${c.id}')">
      <div class="qtext">${escapeHtml(c.text)}</div>
      <span class="del" onclick="removeCheckFromDetail('${c.id}')">✕</span>
    </div>
  `).join('');
}

/* ---------- Notes ---------- */
function addNote() {
  const game = document.getElementById('note-game').value.trim();
  const text = document.getElementById('note-text').value.trim();
  if (!game || !text) return;
  state.notes.unshift({ id: uid(), game, text });
  document.getElementById('note-game').value = '';
  document.getElementById('note-text').value = '';
  saveState(); renderNotes();
}
function removeNote(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  saveState(); renderNotes();
}
function renderNotes() {
  const el = document.getElementById('notes-list');
  if (!state.notes.length) { el.innerHTML = '<div class="empty">No notes yet</div>'; return; }
  el.innerHTML = state.notes.map(n => `
    <div class="note-card">
      <span class="del" onclick="removeNote('${n.id}')">✕</span>
      <div class="game">${escapeHtml(n.game)}</div>
      <div class="text">${escapeHtml(n.text)}</div>
    </div>
  `).join('');
}

/* ---------- Checklist (global, not tied to a specific game) ---------- */
function addCheck() {
  const text = document.getElementById('check-text').value.trim();
  if (!text) return;
  state.checklist.push({ id: uid(), text, checked: false });
  document.getElementById('check-text').value = '';
  saveState(); renderChecklist();
}
function removeCheck(id) {
  state.checklist = state.checklist.filter(c => c.id !== id);
  saveState(); renderChecklist();
}
function toggleCheck(id) {
  const item = state.checklist.find(c => c.id === id);
  if (item) item.checked = !item.checked;
  saveState(); renderChecklist();
}
function renderChecklist() {
  const el = document.getElementById('checklist-list');
  const list = state.checklist.filter(c => !c.gameId);
  if (!list.length) { el.innerHTML = '<div class="empty">No questions added yet</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="check-item ${c.checked ? 'checked' : ''}">
      <input type="checkbox" ${c.checked ? 'checked' : ''} onchange="toggleCheck('${c.id}')">
      <div class="qtext">${escapeHtml(c.text)}</div>
      <span class="del" onclick="removeCheck('${c.id}')">✕</span>
    </div>
  `).join('');
}

/* ---------- Events ---------- */
function addEvent() {
  const name = document.getElementById('event-name').value.trim();
  if (!name) return;
  const start = document.getElementById('event-start').value;
  const end = document.getElementById('event-end').value;
  state.events.push({ id: uid(), name, start, end });
  document.getElementById('event-name').value = '';
  document.getElementById('event-start').value = '';
  document.getElementById('event-end').value = '';
  saveState(); renderEvents();
}
function removeEvent(id) {
  state.events = state.events.filter(e => e.id !== id);
  saveState(); renderEvents();
}
function formatEventDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function eventStatus(ev) {
  const today = new Date().toISOString().slice(0, 10);
  if (ev.start && today < ev.start) return 'upcoming';
  if (ev.end && today > ev.end) return 'ended';
  if (ev.start && today >= ev.start && (!ev.end || today <= ev.end)) return 'live';
  return 'upcoming';
}
function renderEvents() {
  const el = document.getElementById('events-list');
  if (!state.events.length) { el.innerHTML = '<div class="empty">No events added yet</div>'; return; }

  const sorted = [...state.events].sort((a, b) => (a.start || '9999').localeCompare(b.start || '9999'));
  el.innerHTML = sorted.map(ev => {
    const status = eventStatus(ev);
    const label = status === 'live' ? 'LIVE NOW' : status === 'upcoming' ? 'UPCOMING' : 'ENDED';
    const startLabel = formatEventDate(ev.start);
    const endLabel = formatEventDate(ev.end);
    let range = '';
    if (startLabel && endLabel) range = `${startLabel} → ${endLabel}`;
    else if (startLabel) range = `Starts ${startLabel}`;
    else if (endLabel) range = `Ends ${endLabel}`;
    else range = 'No dates set';
    return `<div class="event-card">
      <span class="del" onclick="removeEvent('${ev.id}')">✕</span>
      <div class="name">${escapeHtml(ev.name)}</div>
      <div class="range">${range}</div>
      <div class="status ${status}">${label}</div>
    </div>`;
  }).join('');
}

/* ---------- Backup ---------- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `two-books-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      state = Object.assign({ positions: [], trades: [], gaps: [], games: [], notes: [], checklist: [], events: [] }, parsed);
      saveState(); renderAll();
    } catch (e) {
      alert('That file could not be read as a backup.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderAll() {
  renderStats();
  renderSparkline();
  renderPositions();
  renderTrades();
  renderGaps();
  renderGames();
  renderNotes();
  renderChecklist();
  renderEvents();
}

window.addEventListener('resize', () => renderSparkline());

loadState();
</script>
</body>
</html>
